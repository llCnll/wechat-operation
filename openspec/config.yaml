schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours
context: |
  语言：中文（简体）
  所有产出物必须用简体中文撰写。
  文件格式：UTF-8
  spec 组织原则：所有 spec 放在仓库根目录的 /openspec 下统一管理，不放到各端子项目内部。
  specs 划分原则：按仓库一级代码模块组织；模块 spec 内按业务能力定义 Requirement；跨模块要求归入主要代码所有者，并在 Purpose 标明边界。
  change 归档：归档后先同步 delta spec；design/proposal 按 L0/L1/L2 归纳，L1 写入模块 design/decisions.md，L2 写入主题 design 的关键取舍（背景、决策、否决方案、约束、重新评估条件），可重复操作进入 runbooks，任务实施记录不进入长期文档。信息归位并核对可追溯后清理归档包，源 commit 和原始路径写入 L1/L2 文档。
  实现组织原则：代码按平台和服务划分，平台内可再按能力组织实现。
  发版原则：按交付物发版，不按能力发版；能力用于需求、设计和任务拆分。
