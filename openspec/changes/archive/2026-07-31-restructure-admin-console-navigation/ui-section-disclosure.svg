<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">系统配置左侧区块折叠交互方案</title>
  <desc id="desc">展示默认仅展开运行概览，以及点击右侧目录后展开目标区块并定位的效果。</desc>
  <style>
    .bg{fill:#f5f2ea}.panel{fill:#fffdf8;stroke:#d6e3dd;stroke-width:1.4}.hero{fill:url(#hero);stroke:#93bfb0;stroke-width:1.4}.section{fill:#fffefa;stroke:#d7e4de;stroke-width:1.3}.open{fill:#f8fcfa;stroke:#6ba994;stroke-width:1.8}.toc{fill:#f7fbf9;stroke:#c3ddd3;stroke-width:1.3}.active{fill:#e3f4ec}.kicker{fill:#176f64;font:700 12px 'Microsoft YaHei',sans-serif;letter-spacing:1.2px}.title{fill:#253e37;font:700 22px 'Microsoft YaHei',sans-serif}.heading{fill:#29473e;font:700 17px 'Microsoft YaHei',sans-serif}.body{fill:#62746d;font:600 12px 'Microsoft YaHei',sans-serif}.small{fill:#71827b;font:600 11px 'Microsoft YaHei',sans-serif}.tocText{fill:#405c53;font:700 13px 'Microsoft YaHei',sans-serif}.line{stroke:#d9e7e0;stroke-width:1}.arrow{fill:none;stroke:#176f64;stroke-width:2.2;marker-end:url(#arrowHead)}.note{fill:#eef7f2;stroke:#b9d8ca;stroke-width:1.2}.noteText{fill:#286758;font:700 13px 'Microsoft YaHei',sans-serif}.rule{stroke:#bdd7cd;stroke-width:1.4;stroke-dasharray:5 5}
  </style>
  <defs>
    <linearGradient id="hero" x1="0" x2="1"><stop stop-color="#e8f7ef"/><stop offset="1" stop-color="#fffdf8"/></linearGradient>
    <marker id="arrowHead" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#176f64"/></marker>
  </defs>
  <rect class="bg" width="1440" height="900"/>
  <text x="64" y="48" class="kicker">UI PROPOSAL · SECTION DISCLOSURE</text>
  <text x="64" y="80" class="title">系统配置：左侧内容按区块折叠，目录负责“展开后定位”</text>
  <text x="64" y="105" class="body">Hero 与右侧目录始终保留。为保留首页的恢复方向，运行概览默认展开；其余区块默认折叠。</text>

  <text x="64" y="153" class="kicker">默认进入页面</text>
  <rect x="64" y="170" width="600" height="658" rx="18" class="panel"/>
  <rect x="86" y="194" width="556" height="100" rx="13" class="hero"/>
  <text x="108" y="225" class="kicker">SYSTEM CONFIGURATION</text><text x="108" y="257" class="title">系统配置与追溯台</text><text x="108" y="279" class="small">维护审核策略与受控游戏目录</text>
  <rect x="86" y="320" width="394" height="230" rx="12" class="open"/>
  <text x="108" y="350" class="kicker">RUNTIME OVERVIEW</text><text x="108" y="379" class="heading">运行概览</text><text x="448" y="379" class="tocText">收起  −</text>
  <line x1="108" y1="397" x2="458" y2="397" class="line"/>
  <rect x="108" y="416" width="350" height="43" rx="7" class="note"/><text x="122" y="442" class="noteText">当前操作游戏 · 城主别慌张</text>
  <rect x="108" y="475" width="350" height="52" rx="7" fill="#fff" stroke="#dce9e3"/><text x="122" y="497" class="small">会话、Frame 与下一步恢复方向</text><text x="122" y="516" class="small">既有运行流程 / 服务管理视图原位保留</text>
  <rect x="86" y="568" width="394" height="52" rx="10" class="section"/><text x="108" y="600" class="heading">自动任务生产者</text><text x="443" y="600" class="tocText">展开  +</text>
  <rect x="86" y="634" width="394" height="52" rx="10" class="section"/><text x="108" y="666" class="heading">核心配置</text><text x="443" y="666" class="tocText">展开  +</text>
  <rect x="86" y="700" width="394" height="52" rx="10" class="section"/><text x="108" y="732" class="heading">运行健康</text><text x="443" y="732" class="tocText">展开  +</text>
  <rect x="86" y="766" width="394" height="40" rx="10" class="section"/><text x="108" y="792" class="heading">数据追溯</text><text x="443" y="792" class="tocText">展开  +</text>
  <rect x="502" y="320" width="140" height="244" rx="10" class="toc"/>
  <text x="521" y="349" class="kicker">本页目录</text><line x1="521" y1="363" x2="621" y2="363" class="line"/>
  <rect x="514" y="378" width="116" height="30" rx="6" class="active"/><text x="524" y="398" class="tocText">运行概览</text>
  <text x="524" y="438" class="tocText">自动任务</text><text x="524" y="477" class="tocText">核心配置</text><text x="524" y="516" class="tocText">运行健康</text><text x="524" y="550" class="tocText">数据追溯</text>
  <text x="502" y="592" class="small">目录始终可见</text><text x="502" y="610" class="small">正文按需展开</text>

  <path d="M690 450 C744 450 760 450 814 450" class="arrow"/>
  <text x="691" y="422" class="kicker">点击“核心配置”</text>
  <text x="691" y="441" class="small">先展开，再定位</text>

  <text x="818" y="153" class="kicker">目录主动跳转后的目标态</text>
  <rect x="818" y="170" width="558" height="658" rx="18" class="panel"/>
  <rect x="840" y="194" width="514" height="100" rx="13" class="hero"/>
  <text x="862" y="225" class="kicker">SYSTEM CONFIGURATION</text><text x="862" y="257" class="title">系统配置与追溯台</text>
  <rect x="840" y="320" width="372" height="48" rx="10" class="section"/><text x="862" y="350" class="heading">运行概览</text><text x="1174" y="350" class="tocText">展开  +</text>
  <rect x="840" y="382" width="372" height="48" rx="10" class="section"/><text x="862" y="412" class="heading">自动任务生产者</text><text x="1174" y="412" class="tocText">展开  +</text>
  <rect x="840" y="444" width="372" height="230" rx="12" class="open"/>
  <text x="862" y="474" class="kicker">CONFIGURATION · #core-configuration</text><text x="862" y="503" class="heading">核心配置</text><text x="1174" y="503" class="tocText">收起  −</text>
  <line x1="862" y1="521" x2="1190" y2="521" class="line"/>
  <rect x="862" y="541" width="328" height="43" rx="7" class="note"/><text x="876" y="567" class="noteText">审核策略 · 当前启用版本</text>
  <rect x="862" y="600" width="328" height="50" rx="7" fill="#fff" stroke="#dce9e3"/><text x="876" y="623" class="small">现有配置卡、对话框与操作入口完整保留</text><text x="876" y="641" class="small">仅改变内容的可见性，不改变权限或表单</text>
  <rect x="840" y="692" width="372" height="48" rx="10" class="section"/><text x="862" y="722" class="heading">运行健康</text><text x="1174" y="722" class="tocText">展开  +</text>
  <rect x="840" y="754" width="372" height="48" rx="10" class="section"/><text x="862" y="784" class="heading">数据追溯</text><text x="1174" y="784" class="tocText">展开  +</text>
  <rect x="1230" y="320" width="124" height="244" rx="10" class="toc"/>
  <text x="1247" y="349" class="kicker">本页目录</text><line x1="1247" y1="363" x2="1337" y2="363" class="line"/>
  <text x="1250" y="398" class="tocText">运行概览</text><text x="1250" y="437" class="tocText">自动任务</text>
  <rect x="1242" y="454" width="100" height="30" rx="6" class="active"/><text x="1250" y="474" class="tocText">核心配置</text>
  <text x="1250" y="516" class="tocText">运行健康</text><text x="1250" y="550" class="tocText">数据追溯</text>
  <path d="M1218 475 C1224 475 1226 475 1229 475" class="arrow"/>
  <path d="M64 855 L1376 855" class="rule"/>
  <text x="64" y="881" class="body">交互边界：仅目录主动跳转与直接打开 `#hash` 时展开目标区块；滚动页面时不自动展开，避免阅读过程中的布局跳动。</text>
</svg>
