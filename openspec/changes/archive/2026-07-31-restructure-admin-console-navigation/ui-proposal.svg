<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title desc">
  <title id="title">系统配置页的宽屏与窄屏低保真布局方案</title>
  <desc id="desc">仅超宽屏在正文外侧留白中加入本页目录，不压缩正文；其余视口在标题区和正文之间使用折叠目录。</desc>
  <style>
    .canvas{fill:#f4f1e9}.panel{fill:#fffdf8;stroke:#d7d0c2;stroke-width:1.5}.muted{fill:#6f7b75;font:600 13px 'Microsoft YaHei',sans-serif}.label{fill:#176f64;font:700 12px 'Microsoft YaHei',sans-serif;letter-spacing:1.2px}.title{fill:#263f38;font:700 21px 'Microsoft YaHei',sans-serif}.section{fill:#fffefa;stroke:#d8e5df;stroke-width:1.3}.sectiontitle{fill:#29453d;font:700 16px 'Microsoft YaHei',sans-serif}.line{stroke:#d9e5df;stroke-width:1}.toc{fill:#f7fbf9;stroke:#cbded6;stroke-width:1.3}.tocactive{fill:#e7f4ef}.tocline{stroke:#176f64;stroke-width:3}.chip{fill:#edf6f1;stroke:#bcd8cb;stroke-width:1}.mobile{fill:#10151d}.mobilepanel{fill:#fffdf8;stroke:#d7d0c2;stroke-width:1.2}.mobiletoc{fill:#f3faf6;stroke:#b9d8ca;stroke-width:1.2}.white{fill:#eff6f2;font:600 11px 'Microsoft YaHei',sans-serif}.mtitle{fill:#263f38;font:700 14px 'Microsoft YaHei',sans-serif}.small{fill:#74837c;font:600 11px 'Microsoft YaHei',sans-serif}
  </style>
  <rect class="canvas" width="1440" height="1040"/>
  <text x="64" y="45" class="label">LOW-FIDELITY UI PROPOSAL</text>
  <text x="64" y="77" class="title">系统配置页：保留原长页，用文章目录辅助定位</text>
  <text x="64" y="103" class="muted">目录不是系统导航，不包含服务状态、操作按钮、表单或跨页面入口。</text>

  <text x="64" y="151" class="label">宽屏（≥ 1440px）</text>
  <rect x="64" y="168" width="682" height="796" rx="16" class="panel"/>
  <rect x="64" y="168" width="682" height="42" rx="16" fill="#f8fcfa"/>
  <rect x="64" y="194" width="682" height="16" fill="#f8fcfa"/>
  <text x="90" y="194" class="muted">系统配置 · 顶栏与既有页面框架保持不变</text>
  <rect x="90" y="238" width="630" height="112" rx="13" fill="#eaf6f0" stroke="#72aa9b" stroke-width="1.6"/>
  <text x="114" y="269" class="label">SYSTEM CONFIGURATION</text>
  <text x="114" y="302" class="title">系统配置与追溯台</text>
  <text x="114" y="326" class="muted">既有绿色 Hero 完整保留；不新增快捷操作。</text>
  <rect x="90" y="374" width="630" height="172" rx="12" class="section"/>
  <text x="114" y="404" class="label">RUNTIME OVERVIEW</text>
  <text x="114" y="433" class="sectiontitle">运行概览</text>
  <rect x="114" y="454" width="570" height="68" rx="8" class="chip"/>
  <text x="130" y="482" class="small">当前操作游戏 · 按运行流程 / 按服务管理</text>
  <text x="130" y="505" class="small">现有状态、服务卡与操作入口原位保留</text>
  <rect x="90" y="570" width="630" height="104" rx="12" class="section"/>
  <text x="114" y="603" class="sectiontitle">自动任务生产者</text>
  <text x="114" y="631" class="small">既有生产者卡、规则管理与立即执行入口</text>
  <rect x="90" y="698" width="630" height="82" rx="12" class="section"/>
  <text x="114" y="730" class="sectiontitle">核心配置</text>
  <text x="114" y="755" class="small">策略、受控配置与既有对话框</text>
  <rect x="90" y="804" width="630" height="58" rx="12" class="section"/>
  <text x="114" y="839" class="sectiontitle">运行健康</text>
  <rect x="90" y="884" width="630" height="58" rx="12" class="section"/>
  <text x="114" y="919" class="sectiontitle">数据追溯</text>

  <rect x="750" y="374" width="168" height="294" rx="11" class="toc"/>
  <text x="772" y="403" class="label">本页目录</text>
  <line x1="772" y1="418" x2="896" y2="418" class="line"/>
  <text x="778" y="455" class="mtitle">运行概览</text>
  <text x="778" y="496" class="mtitle">自动任务</text>
  <text x="778" y="537" class="mtitle">核心配置</text>
  <text x="778" y="578" class="mtitle">运行健康</text>
  <text x="778" y="619" class="mtitle">数据追溯</text>
  <text x="750" y="698" class="small">正文外侧固定</text>
  <text x="750" y="718" class="small">不参与正文布局</text>
  <path d="M731 401 C741 401 742 401 748 401" fill="none" stroke="#7cae9f" stroke-width="1.5"/>

  <text x="1010" y="151" class="label">窄屏（≤ 1080px）</text>
  <rect x="1010" y="168" width="330" height="796" rx="24" class="mobile"/>
  <rect x="1022" y="194" width="306" height="744" rx="16" fill="#f6f2e8"/>
  <rect x="1022" y="194" width="306" height="38" rx="16" fill="#fffdf8"/>
  <text x="1040" y="218" class="small">系统配置</text>
  <rect x="1038" y="252" width="274" height="96" rx="11" fill="#eaf6f0" stroke="#b9d9cf"/>
  <text x="1054" y="278" class="label">SYSTEM CONFIGURATION</text>
  <text x="1054" y="306" class="mtitle">系统配置与追溯台</text>
  <text x="1054" y="328" class="small">既有 Hero 保留</text>
  <rect x="1038" y="366" width="274" height="42" rx="8" class="mobiletoc"/>
  <text x="1054" y="392" class="mtitle">本页目录（默认收起）</text>
  <rect x="1038" y="426" width="274" height="146" rx="10" class="mobilepanel"/>
  <text x="1054" y="455" class="label">RUNTIME OVERVIEW</text>
  <text x="1054" y="484" class="sectiontitle">运行概览</text>
  <rect x="1054" y="501" width="240" height="48" rx="7" class="chip"/>
  <text x="1066" y="530" class="small">既有工作范围与服务视图</text>
  <rect x="1038" y="590" width="274" height="92" rx="10" class="mobilepanel"/>
  <text x="1054" y="621" class="sectiontitle">自动任务生产者</text>
  <text x="1054" y="648" class="small">既有卡片与操作入口</text>
  <rect x="1038" y="700" width="274" height="64" rx="10" class="mobilepanel"/>
  <text x="1054" y="739" class="sectiontitle">核心配置</text>
  <rect x="1038" y="782" width="274" height="54" rx="10" class="mobilepanel"/>
  <text x="1054" y="815" class="sectiontitle">运行健康</text>
  <rect x="1038" y="854" width="274" height="54" rx="10" class="mobilepanel"/>
  <text x="1054" y="887" class="sectiontitle">数据追溯</text>
  <text x="1010" y="994" class="muted">目录展开后：只显示五个普通页内链接，不复制正文或操作。</text>
</svg>
