<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">系统配置页内文章目录的交互方案</title>
  <desc id="desc">展示宽屏点击目录和窄屏展开目录后的原生锚点定位，以及不会触发的业务动作。</desc>
  <style>
    .bg{fill:#f4f1e9}.card{fill:#fffdf8;stroke:#d8d1c3;stroke-width:1.4}.soft{fill:#f4faf7;stroke:#c8dfd5;stroke-width:1.2}.target{fill:#e5f4ed;stroke:#4d9889;stroke-width:1.8}.muted{fill:#6f7b75;font:600 14px 'Microsoft YaHei',sans-serif}.label{fill:#176f64;font:700 12px 'Microsoft YaHei',sans-serif;letter-spacing:1px}.title{fill:#263f38;font:700 21px 'Microsoft YaHei',sans-serif}.body{fill:#29453d;font:700 15px 'Microsoft YaHei',sans-serif}.small{fill:#738078;font:600 12px 'Microsoft YaHei',sans-serif}.no{fill:#fff3ef;stroke:#e8c2b8;stroke-width:1.2}.nobody{fill:#8e4438;font:700 13px 'Microsoft YaHei',sans-serif}.arrow{fill:none;stroke:#176f64;stroke-width:2.4;marker-end:url(#head)}.dash{fill:none;stroke:#9fb8ae;stroke-width:1.6;stroke-dasharray:5 5}
  </style>
  <defs><marker id="head" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#176f64"/></marker></defs>
  <rect class="bg" width="1440" height="820"/>
  <text x="64" y="49" class="label">INTERACTION PROPOSAL · NATIVE FRAGMENT ONLY</text>
  <text x="64" y="81" class="title">目录只做原生页内定位，不成为新的操作控制面</text>

  <text x="64" y="133" class="label">宽屏：点击目录项</text>
  <rect x="64" y="150" width="604" height="428" rx="15" class="card"/>
  <rect x="88" y="179" width="554" height="54" rx="9" fill="#eaf6f0" stroke="#72aa9b" stroke-width="1.6"/>
  <text x="105" y="206" class="body">系统配置与追溯台</text><text x="105" y="226" class="small">既有绿色 Hero 完整保留；目录从其后开始</text>
  <rect x="88" y="260" width="386" height="64" rx="9" class="soft"/>
  <text x="105" y="298" class="body">自动任务生产者</text>
  <rect x="88" y="342" width="386" height="84" rx="9" class="target"/>
  <text x="105" y="377" class="label">:TARGET · #core-configuration</text><text x="105" y="405" class="body">核心配置</text>
  <rect x="88" y="444" width="386" height="50" rx="9" class="soft"/>
  <text x="105" y="475" class="body">运行健康</text>
  <rect x="88" y="512" width="386" height="42" rx="9" class="soft"/>
  <text x="105" y="538" class="body">数据追溯</text>
  <rect x="502" y="260" width="140" height="222" rx="10" class="soft"/>
  <text x="519" y="286" class="label">本页目录</text>
  <text x="519" y="324" class="small">运行概览</text><text x="519" y="357" class="small">自动任务</text>
  <text x="519" y="390" class="body">核心配置</text>
  <text x="519" y="429" class="small">运行健康</text><text x="519" y="462" class="small">数据追溯</text>
  <path d="M571 405 C571 390 524 385 482 385" class="arrow"/>
  <text x="88" y="599" class="muted">结果：浏览器仅更新 URL fragment 并滚动；目标显示 :target 定位反馈。</text>

  <rect x="712" y="150" width="664" height="428" rx="15" class="card"/>
  <text x="744" y="184" class="label">窄屏：展开目录后选择链接</text>
  <rect x="748" y="209" width="222" height="322" rx="18" fill="#10151d"/>
  <rect x="758" y="231" width="202" height="280" rx="11" fill="#f6f2e8"/>
  <rect x="772" y="249" width="174" height="58" rx="7" fill="#eaf6f0"/>
  <text x="784" y="275" class="label">SYSTEM CONFIG</text><text x="784" y="295" class="small">既有 Hero</text>
  <rect x="772" y="324" width="174" height="117" rx="7" class="target"/>
  <text x="786" y="350" class="body">本页目录（已展开）</text>
  <text x="786" y="376" class="small">运行概览</text><text x="786" y="395" class="small">自动任务</text>
  <text x="786" y="419" class="small">运行健康</text>
  <rect x="772" y="456" width="174" height="35" rx="7" class="soft"/>
  <text x="786" y="478" class="small">正文：运行概览…</text>
  <path d="M980 410 C1045 410 1072 410 1124 410" class="arrow"/>
  <rect x="1142" y="367" width="202" height="85" rx="9" class="target"/>
  <text x="1158" y="398" class="label">#runtime-health</text>
  <text x="1158" y="429" class="body">既有运行健康区块</text>
  <text x="1010" y="495" class="muted">原生 `<details>` + 普通锚点；不需要脚本。</text>

  <text x="64" y="654" class="label">交互边界</text>
  <rect x="64" y="674" width="1260" height="88" rx="11" class="no"/>
  <text x="91" y="706" class="nobody">点击目录时不会：</text>
  <text x="91" y="735" class="muted">提交 POST　·　打开或关闭服务　·　创建 Job　·　调用 CDP　·　读取 Supervisor　·　改变表单值　·　额外请求 API</text>
  <path d="M64 636 L1324 636" class="dash"/>
</svg>
