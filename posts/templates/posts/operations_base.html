{% load static %}
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}游戏圈内容运营{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'posts/operations.css' %}" rel="stylesheet">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{% url 'operations-dashboard' %}"><span>O</span> 游戏圈运营</a>
    <nav><a {% if request.resolver_match.url_name == 'operations-dashboard' %}class="active"{% endif %} href="{% url 'operations-dashboard' %}">内容管理</a><a {% if request.resolver_match.url_name == 'live-operations-analysis' %}class="active"{% endif %} href="{% url 'live-operations-analysis' %}">运营分析</a><a href="{% url 'admin:index' %}">系统配置</a></nav>
    <div class="topbar-actions"><form class="cdp-login-status is-checking" data-cdp-login-status method="post" action="{% url 'open-controlled-login' %}" title="正在检查受控 Chrome 登录态">{% csrf_token %}<input type="hidden" name="return_to" value="{{ request.get_full_path }}"><button type="submit" disabled aria-live="polite"><span class="cdp-mode">CDP</span><i></i><b data-cdp-login-label>检测中</b></button></form><div class="account">{{ request.user.username }} <a href="{% url 'admin:logout' %}">退出</a></div></div>
  </header>
  <main class="shell">{% block content %}{% endblock %}</main>
  <script>
    (() => {
      const indicator = document.querySelector("[data-cdp-login-status]");
      const label = document.querySelector("[data-cdp-login-label]");
      const button = indicator?.querySelector("button");
      if (!indicator || !label || !button) return;
      const update = async () => {
        try {
          const response = await fetch("{% url 'browser-login-status' %}", {cache: "no-store"});
          const status = await response.json();
          const valid = response.ok && status.valid === true;
          indicator.classList.toggle("is-valid", valid);
          indicator.classList.toggle("is-invalid", !valid);
          indicator.classList.remove("is-checking");
          button.disabled = valid;
          label.textContent = valid ? "已登录" : "未登录，去登录";
          indicator.title = status.reason || (valid ? "受控 Chrome 登录态有效" : "受控 Chrome 登录态无效");
        } catch (_) {
          indicator.classList.remove("is-checking", "is-valid");
          indicator.classList.add("is-invalid");
          button.disabled = false;
          label.textContent = "不可用，去登录";
          indicator.title = "点击后仅会尝试在受控 Chrome 打开固定登录页";
        }
      };
      update();
      window.setInterval(update, 30000);
      window.addEventListener("focus", update);
    })();
  </script>
</body>
</html>
