{% load static %}
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}游戏圈内容运营{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'posts/operations.css' %}" rel="stylesheet">
</head>
<body>
  {% include "posts/includes/topbar.html" %}
  <main class="shell">
    {% if messages %}
    <section class="workspace-feedback" aria-label="操作反馈" aria-live="polite">
      {% for message in messages %}<p class="{{ message.tags|default:'info' }}"><span>{{ message }}</span><button class="workspace-feedback-dismiss" type="button" data-workspace-feedback-dismiss aria-label="关闭提示">关闭</button></p>{% endfor %}
    </section>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
  {% include "posts/includes/cdp_login_status_script.html" %}
  <script>
    document.querySelectorAll("[data-workspace-feedback-dismiss]").forEach((button) => {
      button.addEventListener("click", () => button.closest("p")?.remove());
    });
  </script>
</body>
</html>
